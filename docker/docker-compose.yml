version: '3'

services:
  aiflow-postgresql:
    image: postgres:18
    container_name: aiflow-postgresql
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=xiaoer
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  aiflow-qdrant:
    image: qdrant/qdrant:latest
    container_name: aiflow-qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  default:
    name: aiflow-network
    driver: bridge
